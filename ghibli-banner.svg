<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2350"/>
      <stop offset="35%" stop-color="#4a3a72"/>
      <stop offset="65%" stop-color="#8a6f9b"/>
      <stop offset="100%" stop-color="#f2b48a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e6e8c"/>
      <stop offset="100%" stop-color="#465577"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a68"/>
      <stop offset="100%" stop-color="#2c3652"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232c46"/>
      <stop offset="100%" stop-color="#181f36"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf9b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffdf9b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff6d8">
    <circle cx="80" cy="45" r="1.6"/>
    <circle cx="140" cy="90" r="1.2"/>
    <circle cx="220" cy="40" r="1.8"/>
    <circle cx="300" cy="70" r="1.3"/>
    <circle cx="380" cy="30" r="1.5"/>
    <circle cx="460" cy="60" r="1.1"/>
    <circle cx="520" cy="25" r="1.6"/>
    <circle cx="600" cy="50" r="1.3"/>
    <circle cx="700" cy="35" r="1.8"/>
    <circle cx="770" cy="80" r="1.2"/>
    <circle cx="830" cy="40" r="1.4"/>
    <circle cx="920" cy="65" r="1.6"/>
    <circle cx="1000" cy="30" r="1.3"/>
    <circle cx="1080" cy="55" r="1.7"/>
    <circle cx="1150" cy="35" r="1.2"/>
    <circle cx="40" cy="120" r="1.1"/>
    <circle cx="260" cy="110" r="1.1"/>
    <circle cx="560" cy="95" r="1.2"/>
    <circle cx="960" cy="100" r="1.3"/>
    <circle cx="1120" cy="90" r="1.1"/>
  </g>

  <!-- moon -->
  <circle cx="990" cy="90" r="90" fill="url(#moonGlow)"/>
  <circle cx="990" cy="90" r="42" fill="#fff6d8"/>
  <circle cx="978" cy="78" r="6" fill="#f2e2b0" opacity="0.6"/>
  <circle cx="1002" cy="100" r="9" fill="#f2e2b0" opacity="0.5"/>
  <circle cx="985" cy="105" r="4" fill="#f2e2b0" opacity="0.5"/>

  <!-- distant birds -->
  <g stroke="#2b2350" stroke-width="2" fill="none" opacity="0.5">
    <path d="M700 100 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M740 115 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- far hills -->
  <path d="M0,260 Q150,210 300,250 T600,240 T900,255 T1200,235 L1200,420 L0,420 Z" fill="url(#hillFar)"/>

  <!-- mid hills with trees -->
  <path d="M0,300 Q200,250 420,290 T820,280 T1200,290 L1200,420 L0,420 Z" fill="url(#hillMid)"/>
  <g fill="#232c46">
    <ellipse cx="150" cy="285" rx="22" ry="34"/>
    <ellipse cx="185" cy="295" rx="16" ry="26"/>
    <ellipse cx="1050" cy="280" rx="20" ry="32"/>
    <ellipse cx="1085" cy="292" rx="14" ry="24"/>
  </g>

  <!-- near hill -->
  <path d="M0,345 Q220,300 480,335 T900,325 T1200,340 L1200,420 L0,420 Z" fill="url(#hillNear)"/>

  <!-- cottage -->
  <g transform="translate(150,290)">
    <polygon points="0,60 60,10 120,60" fill="#3a2c40"/>
    <rect x="10" y="60" width="100" height="60" fill="#241a2e"/>
    <rect x="45" y="80" width="16" height="16" rx="2" fill="#ffdf9b"/>
    <circle cx="53" cy="88" r="26" fill="url(#windowGlow)"/>
    <rect x="70" y="90" width="14" height="30" fill="#1b1424"/>
    <rect x="55" y="5" width="8" height="20" fill="#241a2e"/>
    <ellipse cx="59" cy="0" rx="9" ry="5" fill="#4a4056" opacity="0.6"/>
  </g>

  <!-- tall pine near cottage -->
  <g transform="translate(300,275)">
    <rect x="-4" y="55" width="8" height="30" fill="#1b1424"/>
    <polygon points="0,0 -26,55 26,55" fill="#1f2a3d"/>
    <polygon points="0,20 -20,65 20,65" fill="#232f45"/>
    <polygon points="0,40 -16,80 16,80" fill="#28344c"/>
  </g>

  <!-- fireflies -->
  <g fill="#ffe28a" filter="url(#soft)">
    <circle cx="260" cy="330" r="3"/>
    <circle cx="320" cy="350" r="2.5"/>
    <circle cx="380" cy="320" r="3"/>
    <circle cx="230" cy="360" r="2"/>
    <circle cx="410" cy="345" r="2.5"/>
  </g>

  <!-- black cat sitting on the near hill, cute chibi style with big orange eyes -->
  <g transform="translate(505,362) scale(1.15)">
    <!-- glow behind eyes -->
    <ellipse cx="12" cy="-46" rx="42" ry="24" fill="url(#eyeGlow)" opacity="0.45"/>
    <!-- tail curled around -->
    <path d="M44,18 Q82,10 80,-24 Q79,-40 64,-40" stroke="#0d0d12" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="10" cy="6" rx="38" ry="28" fill="#14141a"/>
    <!-- ears: broad rounded triangles, wide set like reference -->
    <path d="M-16,-42 Q-20,-70 -2,-58 Q6,-52 2,-36 Z" fill="#14141a"/>
    <path d="M40,-42 Q44,-70 26,-58 Q18,-52 22,-36 Z" fill="#14141a"/>
    <path d="M-11,-46 Q-13,-62 -1,-53 Q3,-49 0,-40 Z" fill="#2a2024"/>
    <path d="M35,-46 Q37,-62 25,-53 Q21,-49 24,-40 Z" fill="#2a2024"/>
    <!-- head: wide rounded shape -->
    <path d="M-20,-38 Q-24,-8 12,-4 Q48,-8 44,-38 Q40,-58 12,-58 Q-16,-58 -20,-38 Z" fill="#14141a"/>
    <!-- big expressive eyes -->
    <ellipse cx="-2" cy="-32" rx="12" ry="15" fill="#ffb01f"/>
    <ellipse cx="26" cy="-32" rx="12" ry="15" fill="#ffb01f"/>
    <ellipse cx="-2" cy="-29" rx="6" ry="8" fill="#140d02"/>
    <ellipse cx="26" cy="-29" rx="6" ry="8" fill="#140d02"/>
    <circle cx="-5" cy="-38" r="3" fill="#fff8e8"/>
    <circle cx="23" cy="-38" r="3" fill="#fff8e8"/>
    <circle cx="1" cy="-25" r="1.4" fill="#fff8e8" opacity="0.8"/>
    <circle cx="29" cy="-25" r="1.4" fill="#fff8e8" opacity="0.8"/>
    <!-- tiny nose -->
    <path d="M9,-19 Q12,-16 15,-19 Q12,-14 9,-19 Z" fill="#ff9d9d"/>
    <!-- cute smile -->
    <path d="M6,-15 Q9,-11 12,-15" stroke="#3a3238" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M12,-15 Q15,-11 18,-15" stroke="#3a3238" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#d9d3c8" stroke-width="1" opacity="0.75">
      <line x1="-14" y1="-20" x2="-38" y2="-24"/>
      <line x1="-14" y1="-15" x2="-38" y2="-15"/>
      <line x1="-14" y1="-10" x2="-38" y2="-6"/>
      <line x1="38" y1="-20" x2="62" y2="-25"/>
      <line x1="38" y1="-15" x2="62" y2="-15"/>
      <line x1="38" y1="-10" x2="62" y2="-5"/>
    </g>
    <!-- front paws -->
    <ellipse cx="-6" cy="30" rx="10" ry="11" fill="#14141a"/>
    <ellipse cx="28" cy="32" rx="10" ry="11" fill="#14141a"/>
  </g>

  <!-- soft vignette gradient at bottom for text legibility if overlaid -->
  <rect x="0" y="0" width="1200" height="420" fill="black" opacity="0.03"/>
</svg>
