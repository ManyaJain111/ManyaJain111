<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Live status for ManyaJain111: Pikachu used Thunderbolt on the backlog">
<style>
.title { font: 800 28px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill:#1c2333; letter-spacing: .5px; }
.handle { font: 700 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#4a5468; letter-spacing: .18em; }
.lcd-k { font: 700 11px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#13261a; letter-spacing: .18em; }
.lcd { font: 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#13261a; }
.status { font: 800 27px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill:#13261a; }
.repo { font: 700 21px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill:#13261a; }
.msg { font: italic 14px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#13261a; opacity:.85; }
.stat-k { font: 700 11px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#4a5468; letter-spacing: .14em; }
.stat-v { font: 700 18px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#1c2333; }
.chip { font: 700 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#1c2333; }
.foot-k { font: 800 14px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill:#1c2333; letter-spacing: 2px; }
.foot { font: italic 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill:#4a5468; }
/* Animations: CSS keyframes still play when GitHub embeds the SVG as an image */
.ball { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 4s ease-in-out infinite; }
.ball-btn { animation: btn 4s ease-in-out infinite; }
.light { animation: blink 2.4s ease-in-out infinite; }
.power { animation: glow 1.6s ease-in-out infinite; }
.device { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
.lcd-on { animation: open .9s cubic-bezier(.22,1,.36,1) .5s both; }
.bar { animation: fill 1.4s cubic-bezier(.22,1,.36,1) both; }
.stat-v { animation: rise .6s ease-out both; }
@keyframes wobble { 0%, 62%, 100% { transform: rotate(0); } 68% { transform: rotate(-14deg); } 76% { transform: rotate(11deg); } 84% { transform: rotate(-6deg); } 92% { transform: rotate(3deg); } }
@keyframes btn { 0%, 60%, 96%, 100% { fill-opacity: 0; } 66%, 90% { fill-opacity: 1; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes glow { 0%, 100% { fill: #c8323f; } 50% { fill: #ff6b6b; } }
@keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
@keyframes open { from { clip-path: inset(50% 0 50% 0); } 15% { clip-path: inset(49.5% 0 49.5% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fill { from { clip-path: inset(0 100% 0 0 round 4.5px); } to { clip-path: inset(0 0 0 0 round 4.5px); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
